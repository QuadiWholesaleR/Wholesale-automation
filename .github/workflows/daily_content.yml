name: Wholesale Real Estate & 5x Content Automation Machine

on:
  schedule:
    - cron: '0 4 * * *'  # Runs automatically at 12:00 AM Midnight EST (04:00 UTC) every day
  workflow_dispatch:      # Lets you click "Run workflow" from your phone anytime

jobs:
  run-wholesale-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Free Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests pillow edge-tts nest-asyncio

      - name: Execute Full Automation Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          python main_engine.py
