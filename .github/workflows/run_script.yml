name: Wholesale Real Estate & Social Machine Pipeline

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai supabase requests pillow edge-tts

      - name: Execute Full Automation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          python main_engine.py
