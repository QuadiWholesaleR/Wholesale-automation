name: Wholesale Real Estate & Social Machine Pipeline

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 AM UTC (6:00 AM EST)
  workflow_dispatch:      # Allows instant manual execution

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          python -m pip install --upgrade pip
          pip install pillow supabase requests python-dotenv twilio sendgrid

      - name: Execute Full Automation Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          python main_engine.py

      - name: Upload Output Assets
        uses: actions/upload-artifact@v4
        with:
          name: daily-automation-artifacts
          path: |
            *.png
            daily_posts.txt
            deal_summary.json
